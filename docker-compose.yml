services:

  redis:
    container_name: cache_redis
    image: redis:7.2-bookworm
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    container_name: metadata_db
    image: postgres:17.7-trixie
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-adp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka
    hostname: kafka
    container_name: kafka-kraft
    ports:
      - "19092:19092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-init-topics:
    image: apache/kafka
    container_name: kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-upload}
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic $${KAFKA_TOPIC_NAME}
      "

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui
    ports:
      - "8088:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: "kraft-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: "false"
    depends_on:
      - kafka

  ui:
    container_name: adp_ui
    build:
      context: .
      dockerfile: Dockerfile
    image: adp:latest
    command: ["python", "-m", "http.server", "7860", "--directory", "./adp/ui"]
    env_file:
      - .env
    ports:
      - "7860:7860"
    volumes:
      - ./adp/ui:/app/adp/ui
    restart: always

  api:
    container_name: adp_api
    build: .
    image: adp:latest
    command: ["uvicorn", "adp.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - ./adp:/app/adp
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./saved:/tmp/saved
    restart: always

  worker_parse:
    container_name: adp_worker_parse
    build: .
    image: adp:latest
    command: ["python", "-m", "adp.workers.processor"]
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./adp:/app/adp
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./weights:/app/weights
      - ./saved:/tmp/saved

    # deploy:
    #   replicas: 2
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8GB

  # =============================================================================
  # MONITORING STACK
  # =============================================================================
  # Stack monitoring bao gồm: Grafana, Loki, Promtail, Prometheus, Node Exporter
  # Mục đích: Thu thập metrics, logs và visualization
  
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    # Không dùng user: ${USER_ID} để tránh permission issues
    # Grafana container sẽ chạy với user default (grafana:grafana, UID 472)
    volumes:
      # Persistent storage cho Grafana data (dashboards, users, settings)
      - grafana-data:/var/lib/grafana
      # Auto-provision datasources (Prometheus, Loki) khi Grafana start
      # File config: config/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"  # Grafana Web UI
    environment:
      # Admin credentials (đổi password trong production!)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Disable user signup để bảo mật
      - GF_USERS_ALLOW_SIGN_UP=false
      # Enable anonymous access cho demo (tắt trong production)
      # - GF_AUTH_ANONYMOUS_ENABLED=true
      # - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped
    depends_on:
      - prometheus  # Đảm bảo Prometheus start trước
      - loki        # Đảm bảo Loki start trước
    
      
  loki:
    container_name: loki
    image: grafana/loki:2.9.8  # Version cụ thể để đảm bảo compatibility
    volumes:
      # Mount config file từ host vào container
      - ./config/loki:/etc/loki
      # Persistent storage cho log data (indexes và chunks)
      # SỬA: Mount vào /loki thay vì /tmp/loki để tránh permission issues
      - loki-data:/loki
    ports:
      - "3100:3100"  # Loki HTTP API endpoint
    restart: unless-stopped
    # Chỉ định config file path
    command: -config.file=/etc/loki/loki-config.yml
    # Health check để đảm bảo Loki ready trước khi Promtail/Grafana connect
    # SỬA: Dùng wget thay vì curl vì Loki image base Alpine có wget sẵn
    # Nếu vẫn lỗi, có thể comment healthcheck và dùng depends_on không có condition
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
      
  promtail:
    container_name: promtail
    image: grafana/promtail:2.9.8
    volumes:
      # Mount logs directory READ-ONLY (tránh ghi nhầm vào logs)
      - ./logs:/app/logs:ro
      # Mount config
      - ./config/promtail:/etc/promtail
      # Volume để lưu positions.yaml (track đã đọc logs đến đâu)
      - promtail-positions:/tmp
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    # Đợi Loki healthy trước khi start
    depends_on:
      loki:
        condition: service_healthy


  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      # Mount config file
      - ./config/prometheus:/etc/prometheus
      # Persistent storage cho metrics data (time-series database)
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"  # Prometheus Web UI
    restart: unless-stopped
    command:
      # Config file path
      - '--config.file=/etc/prometheus/prometheus.yml'
      # TSDB storage path
      - '--storage.tsdb.path=/prometheus'
      # Retention time: giữ metrics data 15 ngày (có thể tăng lên 30d, 90d tùy nhu cầu)
      - '--storage.tsdb.retention.time=15d'
      # Web console paths
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      # Enable lifecycle API (reload config bằng POST request)
      - '--web.enable-lifecycle'


  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    # SỬA: không dùng network_mode: host vì conflict với ports declaration
    # Dùng bridge network (default) để có thể expose ports
    # network_mode: host  # REMOVED - không tương thích với ports
    ports:
      - "9100:9100"  # Node Exporter metrics endpoint
    volumes:
      # Mount host filesystem READ-ONLY để collect metrics
      # /proc: CPU, memory, network stats
      # /sys: System devices, filesystems stats
      # /: Root filesystem (disk stats)
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      # Chỉ định path của host filesystems trong container
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Exclude virtual filesystems để tránh noise trong metrics
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

volumes:
  kafka-data:
    name: kafka-data
  redis-data:
    name: redis-data
  postgres-data:
    name: postgres-data
  # Volumes cho monitoring stack
  # Lưu data persistent khi restart containers
  grafana-data:
    name: grafana-data  # Grafana dashboards, users, settings
  loki-data:
    name: loki-data  # Loki log indexes và chunks
  promtail-positions:
    name: promtail-positions  # Track vị trí đã đọc logs
  prometheus-data:
    name: prometheus-data  # Prometheus time-series database
