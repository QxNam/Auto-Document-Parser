services:

  redis:
    container_name: cache_redis
    image: redis:7.2-bookworm
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    container_name: metadata_db
    image: postgres:17.7-trixie
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-adp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka
    hostname: kafka
    container_name: kafka-kraft
    ports:
      - "19092:19092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-init-topics:
    image: apache/kafka
    container_name: kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-upload}
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic $${KAFKA_TOPIC_NAME}
      "

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui
    ports:
      - "8088:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: "kraft-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: "false"
    depends_on:
      - kafka

  ui:
    container_name: adp_ui
    build:
      context: .
      dockerfile: Dockerfile
    image: adp:latest
    command: ["python", "-m", "http.server", "7860", "--directory", "./adp/ui"]
    env_file:
      - .env
    ports:
      - "7860:7860"
    volumes:
      - ./adp/ui:/app/adp/ui
    restart: always

  api:
    container_name: adp_api
    build: .
    image: adp:latest
    command: ["uvicorn", "adp.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - ./adp:/app/adp
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./saved:/tmp/saved
    restart: always

  worker_parse:
    container_name: adp_worker_parse
    build: .
    image: adp:latest
    command: ["python", "-m", "adp.workers.processor"]
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./adp:/app/adp
      - ./logs:/app/logs
      - ./weights:/app/weights
      - ./saved:/tmp/saved

