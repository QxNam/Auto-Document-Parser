version: "3.8"

services:
  # ============================================================================
  # KAFKA MESSAGE QUEUE
  # ============================================================================
  kafka:
    image: apache/kafka
    hostname: kafka
    container_name: kafka-kraft
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - adp_network

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui
    ports:
      - "8088:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: "kraft-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: "false"
    depends_on:
      - kafka
    networks:
      - adp_network

  # ============================================================================
  # APPLICATION SERVICES
  # ============================================================================
  api:
    container_name: adp_api
    build: .
    image: adp:latest
    command: ["uvicorn", "adp.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./adp:/app/adp
      - ./tests:/app/tests
      - ./logs:/app/logs
    networks:
      - adp_network
    depends_on:
      - kafka

  # worker:
  #   container_name: adp_worker
  #   build: .
  #   image: adp:latest
  #   command: ["celery", "-A", "adp.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./adp:/app/adp
  #     - ./logs:/app/logs
  #   networks:
  #     - adp_network
  #   depends_on:
  #     - kafka

  # ============================================================================
  # MONITORING STACK - Prometheus, Grafana, Loki, Promtail
  # ============================================================================

  # Prometheus - Thu thập metrics từ /metrics endpoints
  prometheus:
    image: prom/prometheus:latest
    container_name: adp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - adp_network
    restart: unless-stopped

  # Grafana - Dashboard visualization
  grafana:
    image: grafana/grafana:latest
    container_name: adp_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - adp_network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    container_name: adp_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - adp_network
    restart: unless-stopped

  # Promtail - Log shipper (gửi logs lên Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: adp_promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/adp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - adp_network
    depends_on:
      - loki
    restart: unless-stopped

# Networks
networks:
  adp_network:
    driver: bridge

# Volumes
volumes:
  kafka-data:
    name: kafka-data
  prometheus_data:
  grafana_data:
  loki_data: