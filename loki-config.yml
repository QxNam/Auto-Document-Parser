# Loki Configuration
# File này cấu hình Loki để thu thập và lưu trữ logs

auth_enabled: false  # Tắt authentication cho development

# Server configuration
server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Ingester configuration - Xử lý logs đến
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m       # Chunk sẽ được flush sau 5 phút idle
  chunk_retain_period: 30s    # Giữ chunk trong memory 30s sau khi flush
  max_chunk_age: 1h           # Chunk tối đa 1 giờ
  chunk_target_size: 1048576  # Target size 1MB

# Schema configuration - Cấu trúc lưu trữ
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Storage configuration - Nơi lưu trữ logs
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Compactor configuration - Nén và dọn dẹp logs cũ
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem

# Limits configuration - Giới hạn
limits_config:
  retention_period: 720h  # Giữ logs 30 ngày (720 giờ)
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # Reject logs cũ hơn 7 ngày
  ingestion_rate_mb: 10             # Max 10MB/s ingestion rate
  ingestion_burst_size_mb: 20       # Burst size 20MB

# Chunk store configuration
chunk_store_config:
  max_look_back_period: 0s  # Không giới hạn look back

# Table manager configuration
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h  # 30 ngày
